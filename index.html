<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>내 가계부</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#f1ead8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="내 가계부">
<link rel="apple-touch-icon" href="./icon-192.png">
<style>
  :root{
    --green:#1c1c1c; --green-d:#000000; --bg:#f1ead8; --card:#ffffff;
    --red:#ef5a3f; --blue:#4f6fe0; --text:#23201a; --muted:#9a917c; --line:#e7dec9;
    --shadow:0 8px 20px rgba(120,100,60,.10); --r:18px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",
      "Malgun Gothic",sans-serif;
    background:var(--bg); color:var(--text); -webkit-text-size-adjust:100%;
    padding-bottom:calc(72px + env(safe-area-inset-bottom));
  }
  header{
    background:linear-gradient(135deg,#3fc0ef 0%,#1f97cf 100%); color:#fff; padding:14px 16px 18px;
    padding-top:calc(14px + env(safe-area-inset-top));
    position:sticky; top:0; z-index:10;
    border-radius:0 0 24px 24px; box-shadow:0 6px 18px rgba(41,171,224,.25);
  }
  .h-top{display:flex;align-items:center;justify-content:space-between;}
  .h-title{font-size:18px;font-weight:700;}
  .views{display:flex;gap:6px;background:rgba(255,255,255,.18);border-radius:10px;padding:3px;}
  .views button{
    border:none;background:transparent;color:#fff;font-size:14px;padding:6px 12px;
    border-radius:8px;font-weight:600;
  }
  .views button.active{background:#fff;color:var(--green);}
  .nav{display:flex;align-items:center;justify-content:center;gap:18px;margin-top:12px;}
  .nav button{border:none;background:transparent;color:#fff;font-size:22px;width:34px;height:34px;border-radius:50%;}
  .nav .period{font-size:17px;font-weight:700;min-width:140px;text-align:center;}
  .summary{
    display:flex;gap:8px;margin-top:12px;
  }
  .sum-box{
    flex:1;background:rgba(255,255,255,.14);border-radius:10px;padding:8px 10px;text-align:center;
  }
  .sum-box .lab{font-size:11px;opacity:.85;}
  .sum-box .val{font-size:14px;font-weight:700;margin-top:2px;}
  .sum-box.inc .val{color:#cdeaff;}
  .sum-box.exp .val{color:#ffd5d1;}
  .sum-box.inc,.sum-box.exp{cursor:pointer;}
  .sum-box.inc .lab::after,.sum-box.exp .lab::after{content:' ▾';font-size:9px;opacity:.7;}

  main{padding:12px;}

  /* 달력 */
  .cal-head{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:4px;}
  .cal-head div{text-align:center;font-size:12px;color:var(--muted);padding:4px 0;font-weight:600;}
  .cal-head div.sun{color:var(--red);}
  .cal-head div.sat{color:var(--blue);}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
  .cell{
    background:var(--card);border-radius:8px;min-height:62px;padding:4px;
    display:flex;flex-direction:column;font-size:10px;border:1px solid var(--line);
  }
  .cell.empty{background:transparent;border:none;}
  .cell .d{font-size:12px;font-weight:600;margin-bottom:2px;}
  .cell.today .d{background:var(--green);color:#fff;border-radius:50%;width:20px;height:20px;display:flex;align-items:center;justify-content:center;}
  .cell .d.sun{color:var(--red);}
  .cell .d.sat{color:var(--blue);}
  .cell .amt{line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:9px;}
  .cell .amt.exp{color:var(--red);}
  .cell .amt.inc{color:var(--blue);}

  /* 주/일 리스트 */
  .row{
    background:var(--card);border-radius:10px;padding:12px 14px;margin-bottom:8px;
    display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);
  }
  .row .left{display:flex;flex-direction:column;}
  .row .date-big{font-size:16px;font-weight:700;}
  .row .date-sub{font-size:12px;color:var(--muted);margin-top:2px;}
  .row .right{text-align:right;font-size:13px;}
  .row .right .inc{color:var(--blue);}
  .row .right .exp{color:var(--red);}

  .tx{
    background:var(--card);border-radius:10px;padding:12px 14px;margin-bottom:8px;
    display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);
  }
  .tx .cat{font-weight:600;font-size:15px;}
  .tx .memo{font-size:12px;color:var(--muted);margin-top:2px;}
  .tx .v{font-weight:700;font-size:15px;}
  .tx .v.exp{color:var(--red);}
  .tx .v.inc{color:var(--blue);}
  .empty-msg{text-align:center;color:var(--muted);padding:40px 0;font-size:14px;}

  /* FAB */
  .fab{
    position:fixed;right:18px;bottom:calc(80px + env(safe-area-inset-bottom));
    width:56px;height:56px;border-radius:50%;background:var(--green);color:#fff;
    border:none;font-size:30px;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:20;
  }
  /* 하단탭 */
  .tabbar{
    position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);
    display:flex;z-index:15;padding-bottom:env(safe-area-inset-bottom);
  }
  .tabbar button{
    flex:1;border:none;background:transparent;padding:10px 0 8px;font-size:11px;color:var(--muted);
    display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:600;
  }
  .tabbar button.active{color:var(--green);}
  .tabbar .ic{font-size:20px;}

  /* 모달 */
  .overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:30;display:none;
    align-items:flex-end;
  }
  .overlay.show{display:flex;}
  .sheet{
    background:var(--bg);width:100%;border-radius:18px 18px 0 0;padding:16px;
    max-height:90vh;overflow-y:auto;padding-bottom:calc(16px + env(safe-area-inset-bottom));
  }
  .sheet h3{margin:4px 0 14px;text-align:center;font-size:17px;}
  .seg{display:flex;background:#e7e9e6;border-radius:10px;padding:3px;margin-bottom:14px;}
  .seg button{flex:1;border:none;background:transparent;padding:9px;border-radius:8px;font-weight:700;font-size:14px;color:var(--muted);}
  .seg button.active-exp{background:var(--red);color:#fff;}
  .seg button.active-inc{background:var(--blue);color:#fff;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:600;}
  .field input,.field select,.field textarea{
    width:100%;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:16px;
    background:#fff;color:var(--text);font-family:inherit;
  }
  .amount-row{display:flex;gap:8px;}
  .amount-row input{flex:1;text-align:right;font-size:20px;font-weight:700;}
  .amount-row select{width:96px;}
  .cats{display:flex;flex-wrap:wrap;gap:8px;}
  .cats button{
    border:1px solid var(--line);background:#fff;border-radius:20px;padding:8px 14px;font-size:14px;color:var(--text);
  }
  .cats button.sel{background:var(--green);color:#fff;border-color:var(--green);}
  .btn-main{
    width:100%;border:none;background:var(--green);color:#fff;padding:15px;border-radius:12px;
    font-size:16px;font-weight:700;margin-top:6px;
  }
  .btn-del{
    width:100%;border:none;background:#fff;color:var(--red);padding:13px;border-radius:12px;
    font-size:15px;font-weight:700;margin-top:8px;border:1px solid var(--line);
  }
  .btn-ghost{
    width:100%;border:1px solid var(--line);background:#fff;color:var(--text);padding:13px;border-radius:12px;
    font-size:15px;font-weight:600;margin-top:8px;
  }
  .day-tx-list{margin:6px 0 12px;}

  /* 항목별 합계 */
  .cat-total{text-align:center;margin:-6px 0 14px;font-weight:800;font-size:20px;}
  .cat-total.exp{color:var(--red);} .cat-total.inc{color:var(--blue);}
  .catrow{background:var(--card);border-radius:14px;padding:11px 14px;margin-bottom:8px;border:1px solid #ece3cf;box-shadow:0 2px 0 #ece3cf;}
  .catrow .top{display:flex;align-items:center;justify-content:space-between;}
  .donut{width:188px;height:188px;display:block;margin:2px auto 14px;}
  .catrow .name{font-weight:700;font-size:15px;}
  .catrow .name .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:middle;}
  .catrow .name .pct{font-size:11px;color:var(--muted);margin-left:6px;font-weight:600;}
  .catrow .amt{font-weight:700;font-size:15px;}
  .catrow.exp .amt{color:var(--red);} .catrow.inc .amt{color:var(--blue);}
  .catrow .bar{height:6px;border-radius:99px;background:#efe7d4;margin-top:9px;overflow:hidden;}
  .catrow .bar > i{display:block;height:100%;border-radius:99px;}
  .catrow.exp .bar > i{background:var(--red);} .catrow.inc .bar > i{background:var(--blue);}

  /* 설정 */
  .set-card{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px;border:1px solid var(--line);}
  .set-card h4{margin:0 0 10px;font-size:15px;}
  .chip-row{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{display:inline-flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:18px;padding:6px 12px;font-size:14px;}
  .chip .x{color:var(--red);font-weight:700;cursor:pointer;}
  .add-inline{display:flex;gap:8px;margin-top:10px;}
  .add-inline input,.add-inline select{flex:1;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:15px;background:#fff;}
  .add-inline button{border:none;background:var(--green);color:#fff;border-radius:10px;padding:0 16px;font-weight:700;}
  .set-row{display:flex;align-items:center;justify-content:space-between;padding:6px 0;}
  .hint{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.5;}
  .seg-sub{display:flex;gap:6px;margin-bottom:10px;}
  .seg-sub button{flex:1;border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px;font-weight:600;font-size:13px;color:var(--muted);}
  .seg-sub button.on{background:var(--green);color:#fff;border-color:var(--green);}

  /* === Ko-fi 느낌: 밝고 둥글둥글, 말랑한 카드 === */
  .h-title{letter-spacing:-.3px;font-weight:800;}
  .views{border-radius:999px;}
  .views button{border-radius:999px;}
  .sum-box{border-radius:16px;background:rgba(255,255,255,.18);}
  .cell:not(.empty){border:none;box-shadow:0 2px 8px rgba(41,171,224,.10);border-radius:14px;}
  .cell.today .d{box-shadow:0 2px 6px rgba(41,171,224,.4);}
  .row,.tx,.set-card{border:none;box-shadow:var(--shadow);}
  .row,.tx{border-radius:var(--r);}
  .set-card{border-radius:22px;}
  .sheet{border-radius:28px 28px 0 0;}
  .seg,.seg button{border-radius:999px;}
  .field input,.field select,.field textarea{border-radius:14px;border-color:var(--line);}
  .cats button{border-radius:999px;}
  .chip{border-radius:999px;}
  .btn-main,.btn-ghost,.btn-del{border-radius:999px;}
  .btn-main{box-shadow:0 6px 16px rgba(41,171,224,.35);}
  .fab{box-shadow:0 8px 22px rgba(41,171,224,.45);}
  .tabbar{box-shadow:0 -2px 14px rgba(41,171,224,.08);border-top:none;}
  .add-inline button{border-radius:12px;}

  /* === 진짜 Ko-fi 느낌: 크림 배경 + 검정 굵은 글씨/버튼 + 코랄·블루 포인트 === */
  body{font-weight:500;}
  header{background:#f1ead8;color:#23201a;box-shadow:none;border-radius:0;border-bottom:1px solid #e7dec9;}
  .h-title{color:#23201a;font-weight:800;letter-spacing:-.3px;}
  .nav button{color:#23201a;}
  .nav .period{color:#23201a;}
  .views{background:#e7dec9;}
  .views button{color:#8a806a;}
  .views button.active{background:#1c1c1c;color:#fff;}
  .sum-box{background:#fff;border:1px solid #e7dec9;}
  .sum-box .lab{color:#9a917c;opacity:1;}
  .sum-box .val{color:#23201a;}
  .sum-box.inc .val{color:var(--blue);}
  .sum-box.exp .val{color:var(--red);}
  .cell:not(.empty){border:1px solid #ece3cf;box-shadow:0 2px 0 #ece3cf;}
  .cell.today .d{box-shadow:none;}
  .row,.tx,.set-card{border:1px solid #ece3cf;box-shadow:0 2px 0 #ece3cf;}
  .btn-main{box-shadow:0 4px 0 #000;}
  .fab{background:var(--red);box-shadow:0 8px 18px rgba(239,90,63,.4);}
  .tabbar{background:#fff;border-top:1px solid #e7dec9;box-shadow:none;}
  .tabbar button.active{color:#1c1c1c;}
  .seg{background:#efe7d4;}
</style>
</head>
<body>

<header>
  <div class="h-top">
    <div class="h-title">내 가계부</div>
    <div class="views">
      <button data-view="month" class="active">월</button>
      <button data-view="week">주</button>
      <button data-view="day">일</button>
    </div>
  </div>
  <div class="nav">
    <button id="prev">‹</button>
    <div class="period" id="period">2026년 6월</div>
    <button id="next">›</button>
  </div>
  <div class="summary">
    <div class="sum-box inc"><div class="lab">수입</div><div class="val" id="sumInc">-</div></div>
    <div class="sum-box exp"><div class="lab">지출</div><div class="val" id="sumExp">-</div></div>
    <div class="sum-box"><div class="lab">합계</div><div class="val" id="sumNet">-</div></div>
  </div>
</header>

<main id="main"></main>

<button class="fab" id="fab">＋</button>

<div class="tabbar">
  <button id="tabHome" class="active"><span class="ic">📅</span>가계부</button>
  <button id="tabSettings"><span class="ic">⚙️</span>설정</button>
</div>

<!-- 입력 모달 -->
<div class="overlay" id="addOverlay">
  <div class="sheet" id="addSheet"></div>
</div>
<!-- 날짜 상세 모달 -->
<div class="overlay" id="dayOverlay">
  <div class="sheet" id="daySheet"></div>
</div>
<!-- 항목별 합계 모달 -->
<div class="overlay" id="catOverlay">
  <div class="sheet" id="catSheet"></div>
</div>

<script>
// ---------- 데이터 ----------
const KEY = 'mybudget_v1';
const SYM = {KRW:'₩',AUD:'A$',USD:'$',JPY:'¥',EUR:'€',GBP:'£',CNY:'¥',CAD:'C$'};
const DEFAULT = {
  transactions: [],
  categories: {
    expense: ['식비','카페/간식','생활용품','교통','주거/통신','의료/건강','쇼핑','문화/여가','교육','경조사','기타'],
    income:  ['월급','용돈','부수입','투자수익','기타']
  },
  currencies: ['KRW','AUD'],
  mainCurrency: 'KRW'
};
let state = load();
function load(){
  try{ const s = JSON.parse(localStorage.getItem(KEY)); if(s&&s.transactions) return s; }catch(e){}
  return JSON.parse(JSON.stringify(DEFAULT));
}
function save(){ localStorage.setItem(KEY, JSON.stringify(state)); }

// ---------- 상태 ----------
let view = 'month';          // month | week | day
let cur = new Date();        // 기준 날짜
let activeTab = 'home';      // home | settings

// ---------- 유틸 ----------
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
function fmt(amount, cur){
  try{
    return new Intl.NumberFormat('ko-KR',{style:'currency',currency:cur,
      maximumFractionDigits:(cur==='KRW'||cur==='JPY')?0:2}).format(amount);
  }catch(e){
    return (SYM[cur]||'')+Number(amount).toLocaleString()+' '+cur;
  }
}
function txByDate(dateStr){ return state.transactions.filter(t=>t.date===dateStr); }
// 통화별 합계 {KRW:{inc,exp}, ...}
function sumsFor(list){
  const m={};
  list.forEach(t=>{
    if(!m[t.currency]) m[t.currency]={inc:0,exp:0};
    if(t.type==='income') m[t.currency].inc+=t.amount; else m[t.currency].exp+=t.amount;
  });
  return m;
}
function startOfWeek(d){ const x=new Date(d); x.setDate(x.getDate()-x.getDay()); x.setHours(0,0,0,0); return x; }

// ---------- 렌더 ----------
function render(){
  if(activeTab==='settings'){ renderSettings(); return; }
  document.querySelectorAll('.views button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));
  const main = document.getElementById('main');
  if(view==='month'){ renderPeriodMonth(); main.innerHTML = monthHTML(); bindMonth(); rangeSummary(monthRange()); }
  else if(view==='week'){ renderPeriodWeek(); main.innerHTML = weekHTML(); bindRows(); rangeSummary(weekRange()); }
  else { renderPeriodDay(); main.innerHTML = dayViewHTML(); bindDayView(); rangeSummary([ymd(cur),ymd(cur)]); }
}

function renderPeriodMonth(){ document.getElementById('period').textContent = `${cur.getFullYear()}년 ${cur.getMonth()+1}월`; }
function renderPeriodWeek(){
  const s=startOfWeek(cur), e=new Date(s); e.setDate(e.getDate()+6);
  document.getElementById('period').textContent = `${s.getMonth()+1}.${s.getDate()} ~ ${e.getMonth()+1}.${e.getDate()}`;
}
function renderPeriodDay(){
  const wd=['일','월','화','수','목','금','토'][cur.getDay()];
  document.getElementById('period').textContent = `${cur.getMonth()+1}월 ${cur.getDate()}일 (${wd})`;
}

function monthRange(){
  const y=cur.getFullYear(), m=cur.getMonth();
  return [ymd(new Date(y,m,1)), ymd(new Date(y,m+1,0))];
}
function weekRange(){ const s=startOfWeek(cur), e=new Date(s); e.setDate(e.getDate()+6); return [ymd(s),ymd(e)]; }
function inRange(d,[a,b]){ return d>=a && d<=b; }

let curRange=null;   // 지금 보고 있는 기간 [시작,끝]
function rangeSummary([a,b]){
  curRange=[a,b];
  const list = state.transactions.filter(t=>inRange(t.date,[a,b]));
  const m = sumsFor(list);
  const codes = Object.keys(m);
  const line = (key)=> codes.length? codes.map(c=>fmt(m[c][key],c)).join('\n') : '0';
  // 합계(통화별 순액)
  const net = codes.length? codes.map(c=>fmt(m[c].inc-m[c].exp,c)).join('\n') : '0';
  document.getElementById('sumInc').textContent = line('inc');
  document.getElementById('sumExp').textContent = line('exp');
  document.getElementById('sumNet').textContent = net;
  ['sumInc','sumExp','sumNet'].forEach(id=>document.getElementById(id).style.whiteSpace='pre-line');
}

// --- 월(달력) ---
function monthHTML(){
  const y=cur.getFullYear(), m=cur.getMonth();
  const first=new Date(y,m,1), startDow=first.getDay();
  const days=new Date(y,m+1,0).getDate();
  const today=ymd(new Date());
  let cells='';
  for(let i=0;i<startDow;i++) cells+=`<div class="cell empty"></div>`;
  for(let d=1; d<=days; d++){
    const dateStr=`${y}-${pad(m+1)}-${pad(d)}`;
    const dow=(startDow+d-1)%7;
    const sums=sumsFor(txByDate(dateStr));
    let amt='';
    Object.keys(sums).forEach(c=>{
      if(sums[c].inc>0) amt+=`<div class="amt inc">${fmt(sums[c].inc,c)}</div>`;
      if(sums[c].exp>0) amt+=`<div class="amt exp">-${fmt(sums[c].exp,c)}</div>`;
    });
    const dcls = dow===0?'sun':(dow===6?'sat':'');
    cells+=`<div class="cell ${dateStr===today?'today':''}" data-date="${dateStr}">
      <div class="d ${dcls}">${d}</div><div class="amt-wrap">${amt}</div></div>`;
  }
  return `<div class="cal-head">
    <div class="sun">일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div class="sat">토</div>
  </div><div class="cal">${cells}</div>`;
}
function bindMonth(){
  document.querySelectorAll('.cell[data-date]').forEach(c=>{
    c.onclick=()=>openDaySheet(c.dataset.date);
  });
}

// --- 주 ---
function weekHTML(){
  const s=startOfWeek(cur);
  let rows='';
  for(let i=0;i<7;i++){
    const d=new Date(s); d.setDate(s.getDate()+i);
    const ds=ymd(d), sums=sumsFor(txByDate(ds));
    const wd=['일','월','화','수','목','금','토'][d.getDay()];
    let right='';
    Object.keys(sums).forEach(c=>{
      if(sums[c].inc>0) right+=`<div class="inc">${fmt(sums[c].inc,c)}</div>`;
      if(sums[c].exp>0) right+=`<div class="exp">-${fmt(sums[c].exp,c)}</div>`;
    });
    if(!right) right='<div style="color:var(--muted)">-</div>';
    rows+=`<div class="row" data-date="${ds}">
      <div class="left"><div class="date-big">${d.getMonth()+1}.${d.getDate()}</div>
      <div class="date-sub">${wd}요일</div></div>
      <div class="right">${right}</div></div>`;
  }
  return rows;
}
function bindRows(){
  document.querySelectorAll('.row[data-date]').forEach(r=> r.onclick=()=>openDaySheet(r.dataset.date));
}

// --- 일 ---
function dayViewHTML(){
  const ds=ymd(cur);
  const list=txByDate(ds);
  if(!list.length) return `<div class="empty-msg">이 날은 기록이 없어요.<br>아래 ＋ 버튼으로 추가해 보세요.</div>`;
  return list.map(t=>txRow(t)).join('');
}
function bindDayView(){
  document.querySelectorAll('.tx[data-id]').forEach(el=>{
    el.onclick=()=>{ const t=state.transactions.find(x=>x.id===el.dataset.id); openAdd(t.date,t); };
  });
}
function txRow(t){
  const isExp=t.type==='expense';
  return `<div class="tx" data-id="${t.id}">
    <div><div class="cat">${t.category}</div>${t.memo?`<div class="memo">${escapeHtml(t.memo)}</div>`:''}</div>
    <div class="v ${isExp?'exp':'inc'}">${isExp?'-':'+'}${fmt(t.amount,t.currency)}</div>
  </div>`;
}
function escapeHtml(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

// ---------- 날짜 상세 시트 ----------
function openDaySheet(dateStr){
  const list=txByDate(dateStr);
  const [y,mo,da]=dateStr.split('-');
  const wd=['일','월','화','수','목','금','토'][new Date(dateStr).getDay()];
  let body = list.length ? `<div class="day-tx-list">${list.map(txRow).join('')}</div>`
    : `<div class="empty-msg">기록이 없어요.</div>`;
  document.getElementById('daySheet').innerHTML =
    `<h3>${+mo}월 ${+da}일 (${wd})</h3>${body}
     <button class="btn-main" id="dayAdd">＋ 이 날에 추가</button>
     <button class="btn-ghost" id="dayClose">닫기</button>`;
  showOverlay('dayOverlay');
  document.getElementById('dayAdd').onclick=()=>{ hideOverlay('dayOverlay'); openAdd(dateStr); };
  document.getElementById('dayClose').onclick=()=>hideOverlay('dayOverlay');
  document.querySelectorAll('#daySheet .tx[data-id]').forEach(el=>{
    el.onclick=()=>{ const t=state.transactions.find(x=>x.id===el.dataset.id);
      hideOverlay('dayOverlay'); openAdd(t.date,t); };
  });
}

// ---------- 항목별 합계 시트 ----------
function openCatSheet(type){            // type: 'inc' | 'exp'
  if(!curRange) return;
  const wantType = type==='inc' ? 'income' : 'expense';
  const list = state.transactions.filter(t=>t.type===wantType && inRange(t.date,curRange));
  const label = document.getElementById('period').textContent;
  const ko = type==='inc' ? '수입' : '지출';
  const sign = type==='inc' ? '+' : '-';

  // 분류별 묶기 (통화별로 따로)
  const map={};                         // 분류 -> {통화:금액}
  list.forEach(t=>{
    if(!map[t.category]) map[t.category]={};
    map[t.category][t.currency]=(map[t.category][t.currency]||0)+t.amount;
  });
  const rows=Object.keys(map).map(cat=>{
    const curs=map[cat];
    const num=Object.values(curs).reduce((s,v)=>s+v,0);   // 정렬·막대용 (대략)
    return {cat,curs,num};
  }).sort((a,b)=>b.num-a.num);
  const grand=rows.reduce((s,r)=>s+r.num,0);

  // 통화별 총합 (제목 아래)
  const totByCur={};
  list.forEach(t=>totByCur[t.currency]=(totByCur[t.currency]||0)+t.amount);
  const totStr=Object.keys(totByCur).map(c=>fmt(totByCur[c],c)).join(' / ')||'0';

  const PALETTE=['#ef5a3f','#4f6fe0','#f0a94f','#5bb98c','#b07cd6','#e57ea0',
                 '#6fc4d8','#c9a24b','#8a9a5b','#d96b6b','#7d8bd4','#cf9b6f'];

  let donut='', listHtml='', acc=0;
  if(rows.length){
    rows.forEach((r,i)=>{
      const p=grand?r.num/grand*100:0;
      const col=PALETTE[i%PALETTE.length];
      // 도넛 한 조각 (12시 방향에서 시계방향)
      donut+=`<circle r="15.9155" cx="18" cy="18" fill="none" stroke="${col}"
        stroke-width="4.5" stroke-dasharray="${p.toFixed(2)} ${(100-p).toFixed(2)}"
        stroke-dashoffset="${(25-acc).toFixed(2)}"></circle>`;
      acc+=p;
      const amtStr=Object.keys(r.curs).map(c=>fmt(r.curs[c],c)).join(' / ');
      listHtml+=`<div class="catrow ${type}">
        <div class="top">
          <div class="name"><span class="dot" style="background:${col}"></span>${r.cat}<span class="pct">${Math.round(p)}%</span></div>
          <div class="amt">${sign}${amtStr}</div>
        </div>
        <div class="bar"><i style="width:${grand?Math.round(r.num/grand*100):0}%;background:${col}"></i></div>
      </div>`;
    });
  }
  const topPct=rows.length?Math.round(rows[0].num/grand*100):0;
  const chart = rows.length
    ? `<svg class="donut" viewBox="0 0 36 36">
         <circle r="15.9155" cx="18" cy="18" fill="none" stroke="#efe7d4" stroke-width="4.5"></circle>
         ${donut}
         <text x="18" y="17.4" text-anchor="middle" font-size="4.2" font-weight="800" fill="#23201a">${topPct}%</text>
         <text x="18" y="21.4" text-anchor="middle" font-size="2.4" fill="#9a917c">${rows[0].cat}</text>
       </svg>`
    : '';
  const body = rows.length ? chart+listHtml
    : `<div class="empty-msg">이 기간엔 ${ko} 기록이 없어요.</div>`;

  document.getElementById('catSheet').innerHTML=
    `<h3>${label} · ${ko} 항목별</h3>
     <div class="cat-total ${type}">${sign}${totStr}</div>
     ${body}
     <button class="btn-ghost" id="catClose">닫기</button>`;
  showOverlay('catOverlay');
  document.getElementById('catClose').onclick=()=>hideOverlay('catOverlay');
}

// ---------- 입력 시트 ----------
let draft=null;
function openAdd(dateStr, existing){
  draft = existing ? {...existing} : {
    id:'t'+Date.now()+Math.random().toString(36).slice(2,6),
    date:dateStr||ymd(cur), type:'expense', amount:'', currency:state.mainCurrency,
    category:state.categories.expense[0]||'', memo:''
  };
  drawAddSheet();
  showOverlay('addOverlay');
}
function drawAddSheet(){
  const cats = state.categories[draft.type==='expense'?'expense':'income'];
  if(!cats.includes(draft.category)) draft.category = cats[0]||'';
  const curOpts = state.currencies.map(c=>`<option value="${c}" ${c===draft.currency?'selected':''}>${c}</option>`).join('');
  document.getElementById('addSheet').innerHTML = `
    <h3>${draft._isEdit||state.transactions.find(t=>t.id===draft.id)?'내역 수정':'내역 추가'}</h3>
    <div class="seg">
      <button id="segExp" class="${draft.type==='expense'?'active-exp':''}">지출</button>
      <button id="segInc" class="${draft.type==='income'?'active-inc':''}">수입</button>
    </div>
    <div class="field"><label>날짜</label><input type="date" id="fDate" value="${draft.date}"></div>
    <div class="field"><label>금액</label>
      <div class="amount-row">
        <input type="number" inputmode="decimal" id="fAmount" placeholder="0" value="${draft.amount}">
        <select id="fCur">${curOpts}</select>
      </div>
    </div>
    <div class="field"><label>분류</label><div class="cats" id="fCats">
      ${cats.map(c=>`<button data-c="${c}" class="${c===draft.category?'sel':''}">${c}</button>`).join('')}
    </div></div>
    <div class="field"><label>메모 (선택)</label><input type="text" id="fMemo" value="${draft.memo?escapeHtml(draft.memo):''}" placeholder="예: 점심 김밥"></div>
    <button class="btn-main" id="fSave">저장</button>
    ${state.transactions.find(t=>t.id===draft.id)?'<button class="btn-del" id="fDel">삭제</button>':''}
    <button class="btn-ghost" id="fCancel">취소</button>
  `;
  const segExp=document.getElementById('segExp'), segInc=document.getElementById('segInc');
  segExp.onclick=()=>{ draft.type='expense'; draft.category=''; drawAddSheet(); };
  segInc.onclick=()=>{ draft.type='income'; draft.category=''; drawAddSheet(); };
  document.querySelectorAll('#fCats button').forEach(b=> b.onclick=()=>{ draft.category=b.dataset.c;
    document.querySelectorAll('#fCats button').forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); });
  document.getElementById('fDate').onchange=e=>draft.date=e.target.value;
  document.getElementById('fAmount').oninput=e=>draft.amount=e.target.value;
  document.getElementById('fCur').onchange=e=>draft.currency=e.target.value;
  document.getElementById('fMemo').oninput=e=>draft.memo=e.target.value;
  document.getElementById('fSave').onclick=saveDraft;
  document.getElementById('fCancel').onclick=()=>hideOverlay('addOverlay');
  const del=document.getElementById('fDel'); if(del) del.onclick=deleteDraft;
}
function saveDraft(){
  const amt=parseFloat(draft.amount);
  if(!draft.category){ alert('분류를 골라주세요.'); return; }
  if(isNaN(amt)||amt<=0){ alert('금액을 올바르게 입력해주세요.'); return; }
  const tx={id:draft.id,date:draft.date,type:draft.type,amount:amt,currency:draft.currency,
    category:draft.category,memo:(draft.memo||'').trim()};
  const i=state.transactions.findIndex(t=>t.id===tx.id);
  if(i>=0) state.transactions[i]=tx; else state.transactions.push(tx);
  state.transactions.sort((a,b)=> a.date<b.date?1:-1);
  save(); hideOverlay('addOverlay'); render();
}
function deleteDraft(){
  if(!confirm('이 내역을 삭제할까요?')) return;
  state.transactions=state.transactions.filter(t=>t.id!==draft.id);
  save(); hideOverlay('addOverlay'); render();
}

// ---------- 설정 ----------
let setTab='expense'; // 카테고리 탭
function renderSettings(){
  document.getElementById('period').textContent='설정';
  document.querySelector('.summary').style.display='none';
  document.querySelector('.nav').style.display='none';
  document.querySelector('.views').style.display='none';
  const main=document.getElementById('main');
  main.innerHTML = `
    <div class="set-card">
      <h4>💰 통화 (돈 단위)</h4>
      <div class="chip-row" id="curChips"></div>
      <div class="add-inline">
        <input id="newCur" placeholder="예: USD, JPY" maxlength="3" style="text-transform:uppercase">
        <button id="addCur">추가</button>
      </div>
      <div class="set-row" style="margin-top:12px">
        <span>기본 통화</span>
        <select id="mainCur" style="border:1px solid var(--line);border-radius:8px;padding:8px;font-size:15px"></select>
      </div>
      <div class="hint">통화마다 따로 합산돼서, 호주달러와 원화를 섞어 써도 기존 기록이 안 바뀌어요.</div>
    </div>

    <div class="set-card">
      <h4>🏷️ 카테고리</h4>
      <div class="seg-sub">
        <button id="ctExp" class="${setTab==='expense'?'on':''}">지출</button>
        <button id="ctInc" class="${setTab==='income'?'on':''}">수입</button>
      </div>
      <div class="chip-row" id="catChips"></div>
      <div class="add-inline">
        <input id="newCat" placeholder="새 분류 이름">
        <button id="addCat">추가</button>
      </div>
    </div>

    <div class="set-card">
      <h4>💾 백업</h4>
      <button class="btn-ghost" id="expBtn">📤 백업 파일 내보내기</button>
      <button class="btn-ghost" id="impBtn">📥 백업 파일 불러오기</button>
      <input type="file" id="impFile" accept="application/json" style="display:none">
      <div class="hint">내보내기를 누르면 모든 기록이 파일 하나로 저장돼요. 폰을 바꾸거나 앱을 다시 깔 때 이 파일을 불러오면 그대로 복구돼요. 가끔 백업해 두세요!</div>
    </div>

    <div class="set-card">
      <h4>ℹ️ 안내</h4>
      <div class="hint">이 가계부는 인터넷 없이도 작동하고, 기록은 이 폰 안에만 저장돼요(개인정보 안전). 그래서 백업이 중요해요.</div>
    </div>
  `;
  // 통화 칩
  const curChips=document.getElementById('curChips');
  curChips.innerHTML=state.currencies.map(c=>`<span class="chip">${c} ${SYM[c]||''}
    ${state.currencies.length>1?`<span class="x" data-cur="${c}">✕</span>`:''}</span>`).join('');
  curChips.querySelectorAll('.x').forEach(x=>x.onclick=()=>{
    const c=x.dataset.cur;
    state.currencies=state.currencies.filter(v=>v!==c);
    if(state.mainCurrency===c) state.mainCurrency=state.currencies[0];
    save(); renderSettings();
  });
  document.getElementById('addCur').onclick=()=>{
    const v=document.getElementById('newCur').value.trim().toUpperCase();
    if(!/^[A-Z]{3}$/.test(v)){ alert('통화는 영문 3글자예요. 예: USD, JPY'); return; }
    if(!state.currencies.includes(v)) state.currencies.push(v);
    save(); renderSettings();
  };
  // 기본 통화
  const mc=document.getElementById('mainCur');
  mc.innerHTML=state.currencies.map(c=>`<option ${c===state.mainCurrency?'selected':''}>${c}</option>`).join('');
  mc.onchange=e=>{ state.mainCurrency=e.target.value; save(); };
  // 카테고리
  document.getElementById('ctExp').onclick=()=>{setTab='expense';renderSettings();};
  document.getElementById('ctInc').onclick=()=>{setTab='income';renderSettings();};
  const catChips=document.getElementById('catChips');
  const arr=state.categories[setTab];
  catChips.innerHTML=arr.map(c=>`<span class="chip">${c}
    ${arr.length>1?`<span class="x" data-cat="${c}">✕</span>`:''}</span>`).join('');
  catChips.querySelectorAll('.x').forEach(x=>x.onclick=()=>{
    state.categories[setTab]=arr.filter(v=>v!==x.dataset.cat); save(); renderSettings();
  });
  document.getElementById('addCat').onclick=()=>{
    const v=document.getElementById('newCat').value.trim();
    if(!v) return;
    if(!arr.includes(v)) state.categories[setTab].push(v);
    save(); renderSettings();
  };
  // 백업
  document.getElementById('expBtn').onclick=exportData;
  document.getElementById('impBtn').onclick=()=>document.getElementById('impFile').click();
  document.getElementById('impFile').onchange=importData;
}
function exportData(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  const d=new Date();
  a.href=url; a.download=`내가계부_백업_${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}.json`;
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
}
function importData(e){
  const file=e.target.files[0]; if(!file) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(!d.transactions) throw 0;
      if(!confirm('지금 기록을 백업 파일 내용으로 바꿀까요?\n(현재 기록은 사라져요)')) return;
      state=Object.assign(JSON.parse(JSON.stringify(DEFAULT)),d);
      save(); alert('불러오기 완료!'); renderSettings();
    }catch(err){ alert('이 파일은 백업 파일이 아니에요.'); }
  };
  r.readAsText(file);
  e.target.value='';
}

// ---------- 오버레이 ----------
function showOverlay(id){ document.getElementById(id).classList.add('show'); }
function hideOverlay(id){ document.getElementById(id).classList.remove('show'); }
document.getElementById('addOverlay').onclick=e=>{ if(e.target.id==='addOverlay') hideOverlay('addOverlay'); };
document.getElementById('dayOverlay').onclick=e=>{ if(e.target.id==='dayOverlay') hideOverlay('dayOverlay'); };
document.getElementById('catOverlay').onclick=e=>{ if(e.target.id==='catOverlay') hideOverlay('catOverlay'); };
document.querySelector('.sum-box.inc').onclick=()=>openCatSheet('inc');
document.querySelector('.sum-box.exp').onclick=()=>openCatSheet('exp');

// ---------- 이벤트 ----------
document.querySelectorAll('.views button').forEach(b=> b.onclick=()=>{ view=b.dataset.view; render(); });
document.getElementById('prev').onclick=()=>step(-1);
document.getElementById('next').onclick=()=>step(1);
function step(dir){
  if(view==='month') cur.setMonth(cur.getMonth()+dir);
  else if(view==='week') cur.setDate(cur.getDate()+7*dir);
  else cur.setDate(cur.getDate()+dir);
  cur=new Date(cur); render();
}
document.getElementById('fab').onclick=()=>openAdd();
document.getElementById('tabHome').onclick=()=>{
  activeTab='home';
  document.getElementById('tabHome').classList.add('active');
  document.getElementById('tabSettings').classList.remove('active');
  document.querySelector('.summary').style.display='flex';
  document.querySelector('.nav').style.display='flex';
  document.querySelector('.views').style.display='flex';
  document.getElementById('fab').style.display='block';
  render();
};
document.getElementById('tabSettings').onclick=()=>{
  activeTab='settings';
  document.getElementById('tabSettings').classList.add('active');
  document.getElementById('tabHome').classList.remove('active');
  document.getElementById('fab').style.display='none';
  render();
};

// 첫 화면
render();

// 오프라인 지원
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
</script>
